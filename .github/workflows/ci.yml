name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake libgtest-dev
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    - name: Build main.cpp
      working-directory: src
      run: make

    - name: Run main
      working-directory: src
      run: ./main

    - name: Build tests
      working-directory: src
      run: make test

    - name: Run tests
      working-directory: src
      run: ./circular_list_test
